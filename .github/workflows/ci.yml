name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    name: web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        working-directory: web
        run: npm ci
      - name: npm run build
        working-directory: web
        run: npm run build
      - name: npm run test
        working-directory: web
        run: npm run test
      - name: upload dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  go-test:
    name: go vet / test / build
    runs-on: ubuntu-latest
    needs: web-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: download web dist artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: gofmt check
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "gofmt needs to be run on:"
            echo "$fmt_out"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race ./...
      - name: go build (host)
        run: go build ./...

  go-build-cross:
    name: go build (cross-compile)
    runs-on: ubuntu-latest
    needs: web-build
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: arm64
            goarm: ""
          - goos: linux
            goarch: arm
            goarm: "7"
          - goos: linux
            goarch: amd64
            goarm: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: download web dist artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: cross-compile (compile-only check)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: go build -o /dev/null ./cmd/pinctl

  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    needs: web-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: download web dist artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      # v9 of the action tracks the golangci-lint v2 line, which .golangci.yml
      # is written for. Pin the linter itself: "latest" on the older action
      # resolved to a v1 build compiled against Go 1.24, which refuses a
      # module targeting Go 1.25.
      - uses: golangci/golangci-lint-action@v9
        name: run golangci-lint
        with:
          version: v2.12.2
