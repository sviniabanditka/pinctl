name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        working-directory: web
        run: npm ci

      - name: npm run build
        working-directory: web
        run: npm run build

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: cross-compile release binaries
        run: |
          set -eu
          mkdir -p dist

          build() {
            os=$1 arch=$2 arm=$3 name=$4
            echo "building ${name}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" GOARM="$arm" \
              go build -trimpath -ldflags "-s -w" -o "dist/${name}" ./cmd/pinctl
          }

          build linux arm64 "" pinctl-linux-arm64
          build linux arm 7 pinctl-linux-armv7
          build linux amd64 "" pinctl-linux-amd64

      - name: checksums
        working-directory: dist
        run: sha256sum * > checksums.txt

      - name: create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pinctl-linux-arm64
            dist/pinctl-linux-armv7
            dist/pinctl-linux-amd64
            dist/checksums.txt
          generate_release_notes: true
