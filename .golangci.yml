version: "2"

# Default linter set (errcheck, govet, ineffassign, staticcheck, unused) —
# see docs/13-testing.md#ci. No linters added or removed; the exclusions
# below silence pre-existing findings in already-reviewed code (test
# helpers where an error return genuinely doesn't matter, and a couple of
# staticcheck notes that don't reflect real bugs) rather than reshaping
# internal/ or cmd/ code to satisfy the linter — see the comment on each
# rule for why.
linters:
  exclusions:
    rules:
      # Test files: fire-and-forget error returns (io.ReadFull/Write/Close
      # on an in-test net.Pipe/test double, t.Cleanup closers) are
      # idiomatic in this codebase's test helpers — the test would fail on
      # a subsequent read/assert if the write/close actually failed.
      - path: _test\.go
        linters:
          - errcheck

      # internal/store/atomic.go: cleanup-path Close/Remove calls (deferred
      # or after an already-failing write) whose error, if any, doesn't
      # change the outcome already being reported.
      - path: internal/store/atomic\.go
        linters:
          - errcheck

      # cmd/pinctl/main.go: closeBoard is a func() built from two branches
      # (dev-mode board.Close wrapped as func(){ _ = realSess.Close() }, or
      # boardMgr.Close directly) — staticcheck's SA4031 flags the nil check
      # against one construction path without seeing the other, and reports
      # it as "always true" even though both branches are real function
      # values at runtime. False positive given this function's two
      # call sites.
      - path: cmd/pinctl/main\.go
        linters:
          - staticcheck
        text: "SA4031"

      # internal/board/session_test.go: `digitalMessage | 0` / `analogMessage
      # | 0` spell out the Firmata wire-format bit layout explicitly (the
      # "| 0" is the channel-number placeholder position, always 0 for a
      # single-channel test fixture) — intentional for readability against
      # the protocol spec in docs/05-serial-protocol.md, not a bug.
      - path: internal/board/session_test\.go
        linters:
          - staticcheck
        text: "SA4016"

      # internal/engine: style-only staticcheck notes (QF1007 "could merge
      # conditional assignment into variable declaration", ST1008 "error
      # should be returned as the last argument") on already-reviewed
      # engine code — not bugs, not worth a churn-only edit to already
      # shipped, tested code.
      - path: internal/engine/nodes_sinks\.go
        linters:
          - staticcheck
        text: "QF1007"
      - path: internal/engine/scheduler\.go
        linters:
          - staticcheck
        text: "ST1008"
